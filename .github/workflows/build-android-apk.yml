name: Compilar APK Nativo ARGON OS 4.0
on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Preparar Capacitor y Permisos Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp ARGON_OS_v4.html www/index.html
          npx cap add android
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.BLUETOOTH"\/><uses-permission android:name="android.permission.BLUETOOTH_ADMIN"\/><uses-permission android:name="android.permission.BLUETOOTH_CONNECT"\/><uses-permission android:name="android.permission.BLUETOOTH_SCAN"\/><uses-permission android:name="android.permission.BODY_SENSORS"\/><uses-permission android:name="android.permission.ACTIVITY_RECOGNITION"\/><\/manifest>/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ARGON_OS_v4_Nativo_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
