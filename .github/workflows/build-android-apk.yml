name: Compilar APK Nativo ARGON OS 4.0

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Preparar Capacitor, Plugins Nativos (Bluetooth LE + Galería + Sensores)
        run: |
          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 @capacitor-community/bluetooth-le@6.0.0
          mkdir -p www
          cp ARGON_OS_v4.html www/index.html || cp index.html www/index.html
          npx cap add android
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/><uses-permission android:name="android.permission.READ_MEDIA_VIDEO"\/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/><uses-permission android:name="android.permission.BLUETOOTH"\/><uses-permission android:name="android.permission.BLUETOOTH_ADMIN"\/><uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"\/><uses-permission android:name="android.permission.BLUETOOTH_CONNECT"\/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/><uses-permission android:name="android.permission.BODY_SENSORS"\/><\/manifest>/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ARGON_OS_v4_Nativo_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
